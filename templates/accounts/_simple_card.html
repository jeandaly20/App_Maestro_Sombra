{% extends "base.html" %}
{% load static %}

{% block styles %}<link rel="stylesheet" href="{% asset 'css/auth.css' %}">{% endblock %}

{% block body %}
{% block scene %}{% endblock %}
<main class="{% block main_class %}auth-simple{% endblock %}" id="content">
    <section class="auth__main">
        <a class="brand" href="{% url 'login' %}">
            <img class="brand__mark" src="{% static 'img/logo.webp' %}" alt="" width="360" height="258">
            <span class="brand__name">Maestro Sombra</span>
        </a>
        {% block card %}{% endblock %}
    </section>
</main>
{% endblock %}
