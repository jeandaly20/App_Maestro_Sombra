{% if form.non_field_errors %}
    <div class="alert alert--error" role="alert">
        <span class="icon" aria-hidden="true">error</span>
        <div>{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}</div>
    </div>
{% endif %}
{% for message in messages %}
    <div class="alert alert--{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}"
         role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">
        <span class="icon" aria-hidden="true">{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}check_circle{% else %}info{% endif %}</span>
        <p>{{ message }}</p>
    </div>
{% endfor %}
